<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | SELF-CONSULTING</title>
  <meta name="description" content="株式会社SELF-CONSULTINGへのお問い合わせはこちら。システム開発、AI導入、オフショア開発に関するご相談を無料で承ります。">
  <meta property="og:title" content="お問い合わせ | SELF-CONSULTING">
  <meta property="og:url" content="https://self-consulting.co.jp/contact/">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div id="header-placeholder"></div>

<!-- Page Hero -->
<section class="page-hero pt-header" style="padding-top:88px;">
  <div class="container" style="padding-top:60px;padding-bottom:60px;position:relative;z-index:10;">
    <span class="section-badge" style="color:#C5A059;border-color:#C5A059;">Contact</span>
    <h1 style="font-family:Roboto,sans-serif;font-weight:900;font-size:clamp(2rem,4vw,3rem);color:#fff;margin-top:12px;">まずは、あなたの課題をお聞かせください。</h1>
    <p style="color:rgba(255,255,255,0.7);margin-top:16px;max-width:600px;line-height:1.7;">無料相談は随時受け付けております。お気軽にご連絡ください。</p>
  </div>
</section>

<!-- Contact Form -->
<section style="padding:80px 0;background:#f9fafb;">
  <div class="container" style="max-width:800px;">
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:48px;align-items:start;">
      <!-- Form -->
      <div style="background:#fff;border-radius:20px;padding:40px;border:1px solid #e5e7eb;box-shadow:0 4px 20px rgba(0,0,0,0.04);" class="fade-in">
        <h2 style="font-size:1.25rem;font-weight:700;color:#003366;margin-bottom:28px;">お問い合わせフォーム</h2>
        <form id="contact-form" style="display:flex;flex-direction:column;gap:20px;">
          <div>
            <label style="display:block;font-size:0.875rem;font-weight:600;color:#374151;margin-bottom:8px;">お名前 <span style="color:#ef4444;">*</span></label>
            <input type="text" name="name" required placeholder="山田 太郎" class="form-input">
          </div>
          <div>
            <label style="display:block;font-size:0.875rem;font-weight:600;color:#374151;margin-bottom:8px;">会社名</label>
            <input type="text" name="company" placeholder="株式会社〇〇" class="form-input">
          </div>
          <div>
            <label style="display:block;font-size:0.875rem;font-weight:600;color:#374151;margin-bottom:8px;">メールアドレス <span style="color:#ef4444;">*</span></label>
            <input type="email" name="email" required placeholder="example@company.co.jp" class="form-input">
          </div>
          <div>
            <label style="display:block;font-size:0.875rem;font-weight:600;color:#374151;margin-bottom:8px;">電話番号</label>
            <input type="tel" name="tel" placeholder="03-0000-0000" class="form-input">
          </div>
          <div>
            <label style="display:block;font-size:0.875rem;font-weight:600;color:#374151;margin-bottom:8px;">ご相談内容 <span style="color:#ef4444;">*</span></label>
            <select name="service" required class="form-input" style="cursor:pointer;background-image:url(\"data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e\");background-repeat:no-repeat;background-position:right 12px center;background-size:20px;appearance:none;">
              <option value="">選択してください</option>
              <option value="受託開発">受託開発</option>
              <option value="ラボ型開発">ラボ型開発（専属チーム確保）</option>
              <option value="AIソリューション">AIソリューション導入</option>
              <option value="LINE×AI">LINE × AI連携システム</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <div>
            <label style="display:block;font-size:0.875rem;font-weight:600;color:#374151;margin-bottom:8px;">詳細・ご要望 <span style="color:#ef4444;">*</span></label>
            <textarea name="message" required rows="5" placeholder="ご相談内容をできる限り詳しくお書きください。（例：現在の課題、希望する機能、予算感、スケジュールなど）" class="form-input" style="resize:vertical;min-height:120px;"></textarea>
          </div>
          <div>
            <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;">
              <input type="checkbox" name="privacy" required style="margin-top:3px;width:16px;height:16px;flex-shrink:0;accent-color:#C5A059;">
              <span style="font-size:0.875rem;color:#4b5563;line-height:1.6;"><a href="/privacy/" style="color:#C5A059;text-decoration:none;">プライバシーポリシー</a>に同意する</span>
            </label>
          </div>
          <button type="submit" class="btn-primary" style="font-size:1rem;padding:14px;border:none;cursor:pointer;width:100%;text-align:center;">送信する</button>
        </form>
        <div id="form-success" style="display:none;text-align:center;padding:40px 20px;">
          <div style="font-size:3rem;margin-bottom:16px;">✉️</div>
          <h3 style="font-size:1.25rem;font-weight:700;color:#003366;margin-bottom:8px;">送信が完了しました</h3>
          <p style="color:#6b7280;line-height:1.7;">お問い合わせありがとうございます。<br>2営業日以内にご返信いたします。</p>
        </div>
      </div>

      <!-- Contact Info -->
      <div class="fade-in" style="transition-delay:0.1s;">
        <div style="background:#fff;border-radius:16px;padding:28px;border:1px solid #e5e7eb;margin-bottom:20px;">
          <h3 style="font-size:1rem;font-weight:700;color:#003366;margin-bottom:20px;">お問い合わせ情報</h3>
          <div style="display:flex;flex-direction:column;gap:16px;">
            <div style="display:flex;gap:12px;align-items:flex-start;">
              <svg style="flex-shrink:0;margin-top:2px;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C5A059" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <div>
                <p style="font-size:0.8rem;font-weight:600;color:#003366;margin-bottom:2px;">所在地</p>
                <p style="font-size:0.875rem;color:#6b7280;line-height:1.6;">〒110-0015<br>東京都台東区東上野3-32-14</p>
              </div>
            </div>
            <div style="display:flex;gap:12px;align-items:flex-start;">
              <svg style="flex-shrink:0;margin-top:2px;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C5A059" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <div>
                <p style="font-size:0.8rem;font-weight:600;color:#003366;margin-bottom:2px;">返信目安</p>
                <p style="font-size:0.875rem;color:#6b7280;">2営業日以内</p>
              </div>
            </div>
          </div>
        </div>
        <div style="background:linear-gradient(135deg,#003366,#0055aa);border-radius:16px;padding:28px;color:#fff;">
          <h3 style="font-size:1rem;font-weight:700;margin-bottom:12px;">無料相談で確認できること</h3>
          <ul style="list-style:none;padding:0;display:flex;flex-direction:column;gap:10px;">
            <li style="display:flex;gap:8px;font-size:0.875rem;"><span style="color:#C5A059;">✓</span> 概算費用・期間の見積もり</li>
            <li style="display:flex;gap:8px;font-size:0.875rem;"><span style="color:#C5A059;">✓</span> 最適な開発手法の提案</li>
            <li style="display:flex;gap:8px;font-size:0.875rem;"><span style="color:#C5A059;">✓</span> AI活用の可能性</li>
            <li style="display:flex;gap:8px;font-size:0.875rem;"><span style="color:#C5A059;">✓</span> 類似事例・実績の紹介</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

</body>
</html>
